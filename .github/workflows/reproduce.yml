name: reproduce

# Which seeds are stable enough to measure a mutation on?
#
# N2' turned up a contradiction: the same commit, same image, same 15 seeds,
# scored 0.0995 in one run and 0.1121 in another. Rounding explained most of
# it, but seed 8 genuinely diverged -- 21,384 turns at dlvl 19 versus 21,830 at
# dlvl 27 -- and that one seed accounted for the whole gap (0.1889/15 = 0.0126,
# exactly the observed difference).
#
# So the arena is not fully deterministic on long games, which means the paired
# gate cannot currently tell "this mutation changed the game" from "this seed is
# noisy". This measures that directly: score ONE tree two or three times, back to
# back, in one process, and report which seeds ever disagree.
#
# The stable list is then fed to report_confirm.py, so a verdict counts only
# seeds that can actually carry signal.
#
# Free: no agent, no mutation, just repeated evaluation of one tree.

on:
  workflow_dispatch:
    inputs:
      external:
        description: "repo@commit to test (recommended: the parent you will evolve from)"
        required: true
        default: "github.com/DT6A/nethacker@02f00ae3fe4b30291c279108c62c6d72d2edf3b9"
      identity:
        description: "Identity"
        required: true
        default: "hea-gno-neu-mal"
      repeats:
        description: "How many times to score the same tree (2 is enough, 3 is safer)"
        required: false
        default: "2"

permissions:
  contents: write

env:
  ARENA_IMAGE: ghcr.io/dunnolab/nethackers-arena@sha256:0d0b0e779ebda4a05b5a22b39cfafcd2d2d9ef739ea60d9aae79052d55c767ae

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install nethackers
        run: |
          pip install --quiet nethackers==0.37.3
          nethackers --version

      - name: Pull the pinned arena image
        run: docker pull "$ARENA_IMAGE"

      - name: Install gh
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gh
          fi
          gh auth setup-git 2>/dev/null || true

      - name: Fetch the tree
        env:
          EXTERNAL: ${{ inputs.external }}
        run: |
          set -euo pipefail
          nethackers pull "$EXTERNAL" ./tree
          test -f ./tree/bot.py || { echo "::error::no bot.py"; exit 1; }
          find ./tree -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find ./tree -name "*.pyc" -delete 2>/dev/null || true
          du -sh ./tree

      - name: Score the same tree repeatedly
        env:
          IDENTITY: ${{ inputs.identity }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          set -o pipefail
          python reproduce_seeds.py ./tree "$IDENTITY" reproducibility.json "$REPEATS" \
            2>&1 | tee reproduce.log || true
          test -f reproducibility.json || {
            echo "::error::no reproducibility.json produced"; exit 1
          }

      - name: Report
        if: always()
        run: |
          {
            echo "### ${{ inputs.identity }} — seed reproducibility"
            echo
            cat reproduce.log 2>/dev/null | grep -vE '^arena ·' || echo "no log"
            echo
            if [ -f reproducibility.json ]; then
              python - <<'EOF'
          import json
          d = json.load(open("reproducibility.json"))
          print(f"stable seeds   ({len(d['stable_seeds'])}): {d['stable_seeds']}")
          print(f"UNSTABLE seeds ({len(d['unstable_seeds'])}): {d['unstable_seeds']}")
          for i, run in enumerate(d["runs"], 1):
              print(f"  repeat {i} mean {run['mean_progress']:.4f}")
          means = [r["mean_progress"] for r in d["runs"]]
          if len(means) > 1:
              print(f"  spread of the MEAN across identical repeats: "
                    f"{max(means)-min(means):.4f}")
          EOF
            fi
          } | tee reproduce-report.md
          cat reproduce-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the finding
        if: always()
        env:
          IDENTITY: ${{ inputs.identity }}
        run: |
          set -euo pipefail
          DEST="reproducibility/$IDENTITY-${{ github.run_id }}"
          mkdir -p "$DEST"
          cp -f reproducibility.json reproduce.log reproduce-report.md "$DEST/" 2>/dev/null || true
          # Keep the newest stable-seed list at a stable path so the gate can
          # read it without being told a run id.
          if [ -f reproducibility.json ]; then
            mkdir -p reproducibility/latest
            cp -f reproducibility.json "reproducibility/latest/$IDENTITY.json"
          fi
          git config user.name  "nethackers-reproduce"
          git config user.email "nethackers-reproduce@users.noreply.github.com"
          git add -A "$DEST" reproducibility 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -q -m "reproduce: seed stability for $IDENTITY (run ${{ github.run_id }})"
          git push origin HEAD:main || echo "::warning::push failed"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-${{ inputs.identity }}-${{ github.run_id }}
          path: |
            reproducibility.json
            reproduce.log
            reproduce-report.md
          if-no-files-found: warn

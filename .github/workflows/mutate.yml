name: mutate

# One mutator run on linux/amd64. Starts only when dispatched.
# nethackers evolve registers every scored bot (public board, and therefore
# the private verifier's queue). experience.md and experiments.md inside the
# bot tree are gitignored and are not part of those commits.
# This job appends a proposal on main. It does not edit mutator/.

on:
  workflow_dispatch:
    inputs:
      identity:
        description: "Identity for this gameplay (role-race-align-gender)"
        required: true
        default: wiz-hum-cha-mal
      iterations:
        description: "Bot iterations in this run"
        required: true
        default: "3"

permissions:
  contents: write

concurrency:
  group: mutate
  cancel-in-progress: false

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check hub token
        env:
          NETHACKERS_TOKEN: ${{ secrets.NETHACKERS_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${NETHACKERS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: nethackers" \
            https://api.github.com/user)
          if [ "$code" != "200" ]; then
            echo "::error::NETHACKERS_TOKEN was rejected by GitHub (HTTP $code). Refresh it before this job."
            exit 1
          fi

      - name: Install nethackers
        run: pip install --quiet nethackers

      - name: Drop local seed play from the operator brief
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import nethackers.harness.brief as brief
          path = Path(brief.__file__)
          text = path.read_text()
          if "def build_brief(" not in text:
              sys.exit("build_brief not found")
          text += '''

def build_brief(objective_name, character, **_kwargs):
    """The operator prompt. The published sections stay in the file and are not used."""
    identity = character or objective_name
    return (
        "You develop a bot to play NetHack 3.6.6. "
        "The rules and nuances of the game are in `GAME_RULES.md`. "
        "Your task is to write a bot that progresses further in the game. "
        "Progress is the highest milestone a game reaches. "
        "The judge score is the mean of 15 seeds. "
        "Experience level is the milestone that moves this score. "
        f"The identity you are trying to improve is `{identity}`. "
        "You receive the ends of played games. "
        "Describe those games in `experience.md`. "
        "Analyze why the bot lost. "
        "Propose the changes in `experiments.md`, in accordance with the game rules. "
        "Based on `experiments.md`, change the bot. "
        "When `experience.md` or `experiments.md` does not exist yet, create it. "
        "Do not run `python -m nethackers.arena.run`. "
        "The judge plays the 15 seeds after you exit.\\n"
    )
'''
          path.write_text(text)
          import importlib
          importlib.reload(brief)
          sample = brief.build_brief("wiz-hum-cha-mal", "wiz-hum-cha-mal")
          for item in (
              "NetHack 3.6.6",
              "GAME_RULES.md",
              "wiz-hum-cha-mal",
              "experience.md",
              "experiments.md",
              "highest milestone",
              "Do not run `python -m nethackers.arena.run`",
          ):
              if item not in sample:
                  sys.exit(f"brief missing: {item}")
          for bad in ("600000", "any amount of code", "Raise its score", "descends, and advances", "foreground command"):
              if bad in sample:
                  sys.exit(f"brief still has: {bad}")
          PY

      - name: Hub login and git identity
        env:
          NETHACKERS_LOGIN: ${{ secrets.NETHACKERS_LOGIN }}
          NETHACKERS_TOKEN: ${{ secrets.NETHACKERS_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path.home() / ".nethackers" / "credentials.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "login": os.environ["NETHACKERS_LOGIN"],
              "access_token": os.environ["NETHACKERS_TOKEN"],
              "refresh_token": None,
              "expires_at": None,
          }))
          path.chmod(0o600)
          PY
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Mutate
        env:
          # The Actions token cannot call GET /user, so nethackers treats gh as
          # logged out and skips registration. This token is `gh` on the
          # owner's account, which can push.
          GH_TOKEN: ${{ secrets.NETHACKERS_GH_TOKEN }}
          NETHACKERS_LOGIN: ${{ secrets.NETHACKERS_LOGIN }}
        run: |
          set -euo pipefail
          login=$(gh api user -q .login)
          if [ "$login" != "$NETHACKERS_LOGIN" ]; then
            echo "::error::gh is authenticated as $login, hub login is $NETHACKERS_LOGIN"
            exit 1
          fi
          push=$(gh api "repos/$login/nethacker" --jq .permissions.push)
          if [ "$push" != "true" ]; then
            echo "::error::gh cannot push to $login/nethacker, so the scored bot would not be registered"
            exit 1
          fi
          python mutator/loop.py --iterations "${{ inputs.iterations }}" --identity "${{ inputs.identity }}"

      - name: Record the run on main
        if: always()
        run: |
          set -euo pipefail
          git add experience.md experiments.md bot.py arena_adapter.py autoascend nethackers.solution.json LICENSE
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record mutator run"
          git push origin main

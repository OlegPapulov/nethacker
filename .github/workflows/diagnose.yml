name: diagnose

# E12: is a 0.0 the bot, or the seeds?
#
# E11's mutant reported `progress=0.000 completed turns=1` with
#   RuntimeWarning: overflow encountered in scalar subtract
#     self.cursor_pos = (observation['tty_cursor'][0] - 1, observation['tty_cursor'][1])
# and `tty_cursor` is uint8, so row 0 underflows to 255. That expression is the
# tty_chars -> chars row offset, i.e. it looks like PRE-EXISTING AutoAscend code
# rather than the agent's edit.
#
# So: score the UNMODIFIED packaged autoascend tree on both seed tiers and count
# how many episodes die at turn 1. If the baseline does it too, a 0.0 carries no
# information about a mutant and any prescreen built on it selects on noise.
#
# No agent, no mutation, no registration. Cheap by design: two eval batches.

on:
  workflow_dispatch:
    inputs:
      identity:
        description: "Identity to diagnose"
        required: true
        default: "val-dwa-law-fem"
      source:
        description: "Which tree to test"
        required: true
        default: "autoascend"
        type: choice
        options: [autoascend, hub-elite]
      per_tier:
        description: "Validation seeds to run (published tier is always 15)"
        required: false
        default: "5"

permissions:
  contents: write

env:
  ARENA_IMAGE: ghcr.io/dunnolab/nethackers-arena@sha256:0d0b0e779ebda4a05b5a22b39cfafcd2d2d9ef739ea60d9aae79052d55c767ae

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install nethackers
        run: |
          pip install --quiet nethackers==0.37.3
          nethackers --version

      - name: Pull the pinned arena image
        run: docker pull "$ARENA_IMAGE"

      - name: Fetch the tree
        env:
          IDENTITY: ${{ inputs.identity }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          if [ "$SOURCE" = "autoascend" ]; then
            SP=$(python -c "import nethackers, os; print(os.path.dirname(nethackers.__file__))")
            test -d "$SP/roots/autoascend"
            cp -r "$SP/roots/autoascend" ./tree
          else
            nethackers elites --scope "$IDENTITY" > elite.json
            REF=$(python pick_elite.py "$IDENTITY")
            echo "TREE $REF" | tee -a "$GITHUB_STEP_SUMMARY"
            nethackers pull "$REF" ./tree
          fi
          test -f ./tree/bot.py || { echo "::error::no bot.py in tree"; exit 1; }
          du -sh ./tree

      - name: Score both tiers and count turn-1 deaths
        env:
          IDENTITY: ${{ inputs.identity }}
          PER_TIER: ${{ inputs.per_tier }}
        run: |
          set -o pipefail
          python diagnose_seeds.py ./tree "$IDENTITY" diagnosis.json "$PER_TIER" \
            2>&1 | tee diagnosis.log || true

      - name: Report
        if: always()
        run: |
          if [ -f diagnosis.json ]; then
            python report_diagnosis.py diagnosis.json | tee diagnosis-report.md
          else
            echo "no diagnosis.json -- the scoring step failed" | tee diagnosis-report.md
            grep -E "Error|Traceback" diagnosis.log 2>/dev/null | head -20 || true
          fi
          {
            echo "### ${{ inputs.source }} on ${{ inputs.identity }}"
            echo
            cat diagnosis-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-${{ inputs.identity }}-${{ github.run_id }}
          path: |
            diagnosis.json
            diagnosis.log
            diagnosis-report.md
          if-no-files-found: warn

      - name: Commit the diagnosis to the evolve branch
        if: always()
        run: |
          set -euo pipefail
          DEST="diagnoses/${{ inputs.identity }}-${{ github.run_id }}"
          mkdir -p "$DEST"
          cp -f diagnosis.json diagnosis.log diagnosis-report.md "$DEST/" 2>/dev/null || true
          git config user.name  "nethackers-diagnose"
          git config user.email "nethackers-diagnose@users.noreply.github.com"
          git fetch origin evolve || true
          git checkout -q -B evolve FETCH_HEAD 2>/dev/null || git checkout -q -B evolve
          git add -A "$DEST" || true
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -q -m "diagnose: ${{ inputs.source }} on ${{ inputs.identity }} (run ${{ github.run_id }})"
          git push origin HEAD:evolve

name: our-evolve

# Our loop, on our terms.
#
# The stock `nethackers evolve` cannot be told anything: build_brief() takes only
# scores with no free-text parameter, refs.assemble() adds no notes, and the
# mutator strips every instruction-shaped file (AGENTS.md, CLAUDE.md, .claude/,
# opencode.json, ...) from anything it hands the agent. So the measurements in
# this repository cannot reach the operator through it.
#
# This workflow runs loop/evolve.py instead, which composes the brief itself --
# from the measured baseline, the parent tree's experience.md entries (written
# by the agent on a previous iteration, so iteration 1 has none), the game facts
# in GAME_RULES.md, the scoring rule that actually decides acceptance, and the
# contract -- and then hands that string to the project's own mutator. The
# mutator, the arena, the seeding and the image digests are the project's; only
# the brief is ours.
#
# It runs on a native x86_64 runner because the arena is linux/amd64: under
# arm64 emulation a bot's startup never completes and every seed returns turns=0.
#
# The number to watch is NOT the score. It is the hypothesis the operator
# states. One that cites a specific seed's cause of death means the model
# engaged with the brief; one that says "improved combat heuristics" in general
# terms means it did not.
#
# `hypothesis_source` in history.json says where it came from. `tree-comment` is
# a `# hypothesis:` block the agent left in the code. `closing-message` means it
# reverted its own change and the line was condensed out of its final report --
# which used to record `None`, on exactly the runs that had the most to say.
# `report` holds that message in full.

on:
  workflow_dispatch:
    inputs:
      identity:
        description: "Identity to evolve"
        required: true
        default: "wiz-hum-cha-mal"
      iterations:
        description: "How many iterations"
        required: true
        default: "1"
      operator:
        description: "Coding agent"
        required: true
        default: "opencode2"
      model:
        description: "Model id"
        required: true
        default: "opencode/big-pickle"
      seed_mode:
        description: "Where the parent comes from"
        required: true
        default: "autoascend"
        type: choice
        options: [autoascend, hub, pinned]
      parent_ref:
        description: "Exact repo@commit, required when seed_mode=pinned"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # Per identity, not per branch: two runs on different identities must not
  # block each other, and two on the same cell must not race the archive.
  group: our-evolve-${{ inputs.identity }}
  cancel-in-progress: false

jobs:
  evolve:
    name: "our evolve ${{ inputs.identity }} x${{ inputs.iterations }}"
    runs-on: ubuntu-latest
    # Measured over 8 successful single-iteration runs: 9, 42, 81, 87, 95,
    # 96, 141, 153 min -- median 91, not the ~30-45 this comment used to claim.
    # That earlier figure is why a 300-minute budget was set as though five
    # iterations would fit; they need ~455 at the median.
    #
    # 360 is the hard ceiling for a GitHub-hosted job and Support cannot raise
    # it, so this number is not a tuning choice. It fits 3 iterations at the
    # median and 2 with real headroom; a 4th iteration does not fit even in the
    # best case observed.
    #
    # A job killed by this timeout does NOT reach "Upload everything" or "Commit
    # the verdict" below, so it produces no artifact, no results branch and no
    # committed record. Iterations are the unit of loss, not the run.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Runner facts
        run: |
          {
            echo "arch=$(uname -m)"
            echo "cpus=$(nproc)"
            echo "mem_gb=$(free -g | awk '/^Mem:/{print $2}')"
            echo "docker=$(docker version --format '{{.Server.Version}}')"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install nethackers
        run: |
          pip install --quiet nethackers==0.37.3
          nethackers --version | tee -a "$GITHUB_STEP_SUMMARY"
          # `nethackers pull` shells out to `gh repo clone`, and the mutator's
          # credential broker may need it. Not preinstalled on the runner.
          command -v gh >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq gh
          }
          gh auth setup-git 2>/dev/null || true

      # Registration is opt-in by credential, never by default: a run must not
      # be able to push under this account unless someone deliberately added the
      # secrets, and there is nothing to leak when they have not.
      #
      # To enable it, add two repository secrets:
      #   NETHACKERS_TOKEN  a GitHub token. Use a CLASSIC PAT with `public_repo`
      #     and no expiry -- the hub only checks that the token's login owns the
      #     referenced repo. Do NOT paste the access_token from
      #     `nethackers login`: that one expires in ~8h, and
      #     write_credentials.py records no expiry, so the CLI would treat a dead
      #     token as permanent and never refresh it.
      #   NETHACKERS_LOGIN  the login it belongs to, i.e. OlegPapulov
      - name: Authenticate to the hub
        env:
          NETHACKERS_TOKEN: ${{ secrets.NETHACKERS_TOKEN }}
          NETHACKERS_LOGIN: ${{ secrets.NETHACKERS_LOGIN }}
        run: |
          if [ -n "${NETHACKERS_TOKEN:-}" ] && [ -n "${NETHACKERS_LOGIN:-}" ]; then
            python write_credentials.py
            # publish_solution shells out to `gh repo clone` then `git push`, so
            # gh needs its own auth. The built-in GITHUB_TOKEN cannot push to a
            # different repo, so the PAT does both jobs.
            if command -v gh >/dev/null 2>&1; then
              echo "${NETHACKERS_TOKEN}" | gh auth login --hostname github.com \
                --git-protocol https --with-token >/dev/null 2>&1 || true
            fi
            # Prove the credential before betting an iteration on it: a token
            # that only failed at register time would still have cost a full
            # agent call and 15 episodes.
            if nethackers whoami; then
              echo "::notice::hub credentials accepted, self-registration ENABLED"
              echo yes > .hub-auth
            else
              echo "::warning::token rejected by the hub; running without publishing"
              echo no > .hub-auth
            fi
          else
            echo "::warning::no hub credentials; the loop will keep trees but publish nothing"
            echo no > .hub-auth
          fi

      - name: Fetch our sources
        run: |
          set -euo pipefail
          # There is no experience.md here on purpose. The agent writes its own
          # log into the worktree, and the tree carries it forward, so asserting
          # on a repo-root log would fail a run whose log is exactly where it
          # belongs. What must be present is the harness.
          for f in loop/brief.py loop/evolve.py loop/build_game_rules.py \
                   loop/register_evidence.py loop/register_winner.py; do
            test -s "$f" || { echo "::error::$f missing or empty"; exit 1; }
            echo "  $f $(wc -c < "$f") bytes"
          done
          # brief.py resolves GAME_RULES.md relative to the repository root, and
          # evolve.py imports its siblings off sys.path, so all of them have to
          # sit beside it. A stale root copy is worse than none: the loop would
          # import last iteration's register_winner and silently not publish.
          cp loop/brief.py loop/evolve.py \
             loop/register_evidence.py loop/register_winner.py .
          # The agent reads this one directly: it is not stripped from the
          # worktree, and it is the only game knowledge that reaches the model
          # without passing through the brief.
          test -s GAME_RULES.md && echo "  GAME_RULES.md $(wc -c < GAME_RULES.md) bytes"


      - name: Pull the pinned images
        run: |
          docker pull ghcr.io/dunnolab/nethackers-arena@sha256:0d0b0e779ebda4a05b5a22b39cfafcd2d2d9ef739ea60d9aae79052d55c767ae
          docker pull ghcr.io/dunnolab/nethackers-mutator@sha256:32c9222455b2f62082540a9f7293aa8fafc2bd5cb9ba7f4553fe79593706bee5

      - name: Show the brief we will send
        run: |
          # No --experience here: the log belongs to the parent tree, which does
          # not exist until the loop seeds it. This preview is therefore
          # iteration 1's brief exactly -- no log section, because iteration 1
          # has no log yet. Later iterations get one, spliced in from the
          # worktree, and it is the only section that differs.
          python brief.py "${{ inputs.identity }}" \
            --out preview-brief.md
          wc -c preview-brief.md
          # Print enough to confirm the identity's data actually made it in.
          sed -n '1,40p' preview-brief.md
          # The log instruction must survive into the brief, or the agent
          # finishes without writing one and the next iteration starts blind.
          grep -q "experience.md" preview-brief.md \
            || { echo "::error::brief lost its experience.md instruction"; exit 1; }
          echo "  brief instructs the agent to write the log"

      - name: Run our loop
        env:
          IDENTITY: ${{ inputs.identity }}
          ITERATIONS: ${{ inputs.iterations }}
          OPERATOR: ${{ inputs.operator }}
          MODEL: ${{ inputs.model }}
          SEED_MODE: ${{ inputs.seed_mode }}
          PARENT_REF: ${{ inputs.parent_ref }}
        run: |
          set -o pipefail
          python evolve.py "$IDENTITY" \
            --iterations "$ITERATIONS" \
            --operator "$OPERATOR" \
            --model "$MODEL" \
            --seed-mode "$SEED_MODE" \
            ${PARENT_REF:+--parent-ref "$PARENT_REF"} \
            --workdir runs 2>&1 | tee our-evolve.log || true
          echo "--- verdict ---"
          cat runs/history.json 2>/dev/null || echo "no history.json"

      - name: Report
        if: always()
        run: |
          {
            echo "### our loop — ${{ inputs.identity }} — ${{ inputs.operator }}/${{ inputs.model }}"
            echo
            echo "#### log"
            echo '```'
            cat our-evolve.log 2>/dev/null | tail -60 || echo "no log"
            echo '```'
            if [ -f runs/history.json ]; then
              echo "#### history"
              echo '```json'
              cat runs/history.json
              echo '```'
            fi
          } | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload everything
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: our-evolve-${{ inputs.identity }}-${{ github.run_id }}
          path: |
            our-evolve.log
            report.md
            preview-brief.md
            runs/baseline.json
            runs/history.json
            runs/brief-*.md
            runs/history.json
            runs/transcript-*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Commit the verdict
        if: always()
        env:
          IDENTITY: ${{ inputs.identity }}
          OPERATOR: ${{ inputs.operator }}
          MODEL: ${{ inputs.model }}
          CONCLUSION: ${{ job.status }}
        run: |
          set +e
          # A few hundred bytes a run, not 13.6 M lines. `runs/` and the tree
          # under work-*/ are gitignored now; the transcript and the mutated
          # tree stay in the artifact above for 30 days.
          python log_verdict.py || echo "::warning::could not write the verdict"
          cat log/*.json 2>/dev/null >> "$GITHUB_STEP_SUMMARY"
          if ls runs/transcript-*.log >/dev/null 2>&1; then
            echo "transcript present:" | tee -a "$GITHUB_STEP_SUMMARY"
            ls -la runs/transcript-*.log | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no transcript was captured this run" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          git config user.name  "nethackers-our-evolve"
          git config user.email "nethackers-our-evolve@users.noreply.github.com"
          git add log 2>/dev/null
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "our-evolve: $IDENTITY run ${{ github.run_id }} (${{ inputs.operator }}/${{ inputs.model }})"
          git push origin HEAD:main || echo "::warning::push failed (concurrent run?)"
